<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F17" />
    <meta name="color-scheme" content="dark" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />

    <title>RAP FLOW COACH v0.8.5</title>

    <style>
      :root {
        --bg: #0b0f17;
        --panel: rgba(255, 255, 255, 0.06);
        --panel2: rgba(255, 255, 255, 0.09);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
        --muted2: rgba(255, 255, 255, 0.55);
        --line: rgba(255, 255, 255, 0.12);
        --accent: #00E5FF;
        --accent2: #FFFFFF;
        --good: #00E5FF;
        --warn: #fbbf24;
        --danger: #fb7185;
        --amber: #fbbf24;
        --success: #34d399;

        --radius: 18px;
        --radius2: 14px;
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans TC", "PingFang TC", "Heiti TC", Arial, sans-serif;
        background: radial-gradient(1200px 700px at 50% -10%, rgba(0, 229, 255, 0.18), transparent 60%),
                    radial-gradient(900px 500px at 10% 20%, rgba(0, 229, 255, 0.12), transparent 55%),
                    var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      button, input {
        font: inherit;
        color: inherit;
      }

      .app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(18px + var(--safe-bottom)) calc(16px + var(--safe-left));
        max-width: 740px;
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .brand .title {
        font-weight: 700;
        letter-spacing: 0.2px;
        font-size: 16px;
        color: var(--text);
      }
      .brand .subtitle {
        font-size: 12px;
        color: var(--muted);
        display: none;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 8px 22px rgba(0,0,0,0.25);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .pill .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted2);
        flex-shrink: 0;
      }
      .pill[data-state="playing"] .dot { background: var(--good); }
      .pill[data-state="paused"] .dot { background: var(--warn); }
      .pill .stateText {
        font-size: 12px;
        color: var(--muted);
        user-select: none;
        white-space: nowrap;
      }
      
      .calendarBtn {
        padding: 10px 12px;
        font-size: 18px;
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--line);
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.2s;
        touch-action: manipulation;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .calendarBtn:hover {
        background: rgba(255,255,255,0.12);
        border-color: rgba(255,255,255,0.2);
      }
      .calendarBtn:active {
        background: rgba(0,229,255,0.2);
        border-color: rgba(0,229,255,0.4);
        transform: scale(0.95);
      }
      
      .calendarModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.75);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-y: auto;
      }
      .calendarModal.show {
        display: flex;
      }
      .calendarContent {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        max-width: 600px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: var(--shadow);
      }
      .calendarHeader {
        padding: 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .calendarHeader h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
      .calendarCloseBtn {
        padding: 6px 12px;
        font-size: 14px;
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .calendarCloseBtn:hover {
        background: rgba(255,255,255,0.12);
      }
      .calendarBody {
        padding: 16px;
      }
      .calendarNav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .calendarNavBtn {
        padding: 8px 16px;
        font-size: 14px;
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .calendarNavBtn:hover {
        background: rgba(255,255,255,0.12);
      }
      .calendarMonthYear {
        font-size: 16px;
        font-weight: 600;
      }
      .calendarGrid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        margin-bottom: 16px;
      }
      .calendarDayHeader {
        padding: 8px;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .calendarDay {
        aspect-ratio: 1;
        padding: 6px 4px;
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        position: relative;
        background: rgba(255,255,255,0.03);
        min-height: 0;
      }
      .calendarDay:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(0,229,255,0.3);
      }
      .calendarDay.otherMonth {
        opacity: 0.3;
      }
      .calendarDay.today {
        border-color: rgba(0,229,255,0.5);
        background: rgba(0,229,255,0.1);
      }
      .calendarDay.hasTraining {
        background: rgba(0,229,255,0.2);
        border-color: rgba(0,229,255,0.5);
      }
      .calendarDay.goalAchieved {
        background: rgba(52,211,153,0.25);
        border-color: rgba(52,211,153,0.6);
        box-shadow: 0 0 0 2px rgba(52,211,153,0.3);
      }
      .calendarDay.goalAchieved .calendarDayNumber {
        color: var(--success);
      }
      .calendarDay.goalAchieved .calendarDaySessions,
      .calendarDay.goalAchieved .calendarDayDuration {
        color: rgba(52,211,153,0.9);
      }
      .calendarDayNumber {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 2px;
      }
      .calendarDaySessions {
        font-size: 9px;
        font-weight: 700;
        color: var(--accent);
        line-height: 1.2;
        text-align: center;
        margin-bottom: 2px;
      }
      .calendarDayDuration {
        font-size: 9px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.2;
        text-align: center;
      }
      .calendarStats {
        padding: 12px;
        background: rgba(255,255,255,0.05);
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .calendarStatsTitle {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .calendarStatsGrid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }
      .calendarStatItem {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .calendarStatLabel {
        font-size: 11px;
        color: var(--muted2);
      }
      .calendarStatValue {
        font-size: 18px;
        font-weight: 700;
        color: var(--accent);
      }
      .calendarBpmStatsSection {
        grid-column: 1 / -1;
        margin-top: 8px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .calendarBpmStatsTitle {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .calendarBpmStatsGrid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .calendarBpmStatItem {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px;
        background: rgba(255,255,255,0.03);
        border-radius: 4px;
      }
      .calendarBpmStatLabel {
        font-size: 10px;
        color: var(--muted2);
      }
      .calendarBpmStatValue {
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
      }
      .calendarGrooveBpmSection {
        margin-top: 12px;
        margin-bottom: 12px;
      }
      .calendarGrooveBpmSection:first-child {
        margin-top: 0;
      }
      .calendarGrooveBpmTitle {
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 6px;
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(0,229,255,0.2);
      }
      .calendarDayDetail {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 2px solid var(--line);
      }
      .calendarDayDetailTitle {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 16px;
        color: var(--text);
        letter-spacing: 0.3px;
      }
      .calendarSessionList {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .calendarDayDetailSummary {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 16px;
        padding: 12px;
        background: rgba(255,255,255,0.05);
        border-radius: 8px;
      }
      .calendarDayDetailSummaryItem {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .calendarDayDetailSummaryLabel {
        font-size: 11px;
        color: var(--muted2);
      }
      .calendarDayDetailSummaryValue {
        font-size: 16px;
        font-weight: 700;
        color: var(--accent);
      }
      .calendarSessionGroup {
        margin-bottom: 24px;
      }
      .calendarSessionGroup:last-child {
        margin-bottom: 0;
      }
      .calendarSessionGroupTitle {
        font-size: 14px;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 2px solid rgba(0,229,255,0.3);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .calendarSessionGroupTitle::before {
        content: '';
        width: 3px;
        height: 16px;
        background: var(--accent);
        border-radius: 2px;
      }
      .calendarSessionItem {
        padding: 14px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        font-size: 12px;
        margin-bottom: 10px;
        transition: all 0.2s;
        position: relative;
      }
      .calendarSessionItem:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(0,229,255,0.3);
        transform: translateY(-1px);
      }
      .calendarSessionItem:last-child {
        margin-bottom: 0;
      }
      .calendarSessionHeader {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 10px;
      }
      .calendarSessionDuration {
        color: var(--accent);
        font-weight: 700;
        font-size: 18px;
        line-height: 1.2;
        white-space: nowrap;
        background: rgba(0,229,255,0.12);
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid rgba(0,229,255,0.25);
      }
      .calendarBpmRangeSection {
        margin-top: 20px;
        margin-bottom: 20px;
        padding-top: 20px;
        border-top: 2px solid var(--line);
      }
      .calendarBpmRangeTitle {
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .calendarBpmRangeGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 10px;
      }
      .calendarBpmRangeItem {
        padding: 10px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        transition: all 0.2s;
      }
      .calendarBpmRangeItem:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(0,229,255,0.3);
        transform: translateY(-1px);
      }
      .calendarBpmRangeItem.bpmRangeAmber {
        border-color: rgba(251,191,36,0.4);
        background: rgba(251,191,36,0.08);
      }
      .calendarBpmRangeItem.bpmRangeAmber:hover {
        border-color: rgba(251,191,36,0.6);
        background: rgba(251,191,36,0.12);
      }
      .calendarBpmRangeItem.bpmRangeGreen {
        border-color: rgba(52,211,153,0.4);
        background: rgba(52,211,153,0.08);
      }
      .calendarBpmRangeItem.bpmRangeGreen:hover {
        border-color: rgba(52,211,153,0.6);
        background: rgba(52,211,153,0.12);
      }
      .calendarBpmRangeLabel {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .calendarBpmRangeValue {
        font-size: 16px;
        font-weight: 700;
        color: var(--accent);
        line-height: 1.2;
      }
      .calendarBpmRangeItem.bpmRangeAmber .calendarBpmRangeValue {
        color: var(--amber);
      }
      .calendarBpmRangeItem.bpmRangeGreen .calendarBpmRangeValue {
        color: var(--success);
      }
      .calendarBpmRangeCount {
        font-size: 10px;
        color: var(--muted2);
        margin-top: 2px;
      }
      .calendarBpmRangeItem.bpmRangeAmber .calendarBpmRangeCount {
        color: rgba(251,191,36,0.8);
      }
      .calendarBpmRangeItem.bpmRangeGreen .calendarBpmRangeCount {
        color: rgba(52,211,153,0.8);
      }
      
      .dailyGoalHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .dailyGoalTitle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }
      .dailyGoalProgressInfo {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 12px;
      }
      .dailyGoalProgressInfo span:first-child {
        color: var(--text);
        font-weight: 600;
      }
      .dailyGoalProgressInfo span:last-child {
        color: var(--accent);
        font-weight: 700;
        font-size: 14px;
      }
      .dailyGoalProgressBar {
        width: 100%;
        height: 8px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .dailyGoalProgressFill {
        height: 100%;
        background: linear-gradient(90deg, rgba(0,229,255,0.6), rgba(0,229,255,0.8));
        border-radius: 999px;
        transition: width 0.3s ease-out;
        width: 0%;
      }
      .dailyGoalProgressFill.complete {
        background: linear-gradient(90deg, rgba(52,211,153,0.6), rgba(52,211,153,0.8));
      }
      .calendarDailyGoal {
        padding: 12px;
        background: rgba(255,255,255,0.05);
        border-radius: 8px;
        margin-bottom: 16px;
        border: 1px solid var(--line);
      }
      .calendarDailyGoalHeader {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        margin-bottom: 8px;
      }
      .calendarDailyGoalTitle {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .calendarSessionInfo {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 16px;
        margin-bottom: 8px;
      }
      .calendarSessionInfoItem {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
      }
      .calendarSessionInfoLabel {
        font-size: 10px;
        color: var(--muted2);
        font-weight: 500;
        white-space: nowrap;
      }
      .calendarSessionInfoValue {
        font-size: 13px;
        color: var(--text);
        font-weight: 700;
        white-space: nowrap;
      }
      .calendarSessionTags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255,255,255,0.08);
      }
      .calendarSessionTag {
        padding: 3px 8px;
        background: rgba(0,229,255,0.12);
        border: 1px solid rgba(0,229,255,0.25);
        border-radius: 5px;
        font-size: 9px;
        color: var(--accent);
        font-weight: 600;
        letter-spacing: 0.3px;
      }

      .grid {
        display: grid;
        gap: 14px;
      }

      .card {
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.05));
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .cardInner {
        padding: 14px;
        position: relative;
      }

      .bpmRow {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }

      .bpmBig {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        align-items: center;
        text-align: center;
        position: relative;
        transition: all 0.15s ease-out;
      }
      .bpmBig .label {
        font-size: 12px;
        color: var(--muted);
      }
      .bpmBig .valueRow {
        display: flex;
        align-items: center;
        gap: 12px;
        user-select: none;
        touch-action: manipulation;
        justify-content: center;
      }
      .bpmAdjustBtn {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.08);
        color: var(--text);
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
        transition: all 0.2s;
        touch-action: manipulation;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .bpmAdjustBtn:hover {
        background: rgba(255,255,255,0.12);
        border-color: rgba(0,229,255,0.3);
      }
      .bpmAdjustBtn:active {
        background: rgba(0,229,255,0.2);
        border-color: rgba(0,229,255,0.4);
        transform: scale(0.95);
      }
      .bpmBig .value {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.8px;
        line-height: 1;
        min-width: 60px;
        text-align: center;
      }
      .bpmBig .unit {
        font-size: 14px;
        color: var(--muted);
        font-weight: 600;
      }
      .tapTempoBtn {
        margin-top: 12px;
        padding: 10px 24px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        touch-action: manipulation;
        user-select: none;
        width: 100%;
      }
      .tapTempoBtn:hover {
        background: rgba(255,255,255,0.12);
        border-color: rgba(255,255,255,0.2);
      }
      .tapTempoBtn:active {
        background: rgba(0,229,255,0.2);
        border-color: rgba(0,229,255,0.4);
        transform: scale(0.98);
      }
      .bpmSliderRow {
        margin-top: 10px;
        width: 100%;
      }
      .bpmSliderRow input[type="range"] {
        width: 100%;
        appearance: none;
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(0,229,255,0.45), rgba(255,255,255,0.40));
        outline: none;
      }
      .bpmSliderRow input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #0b0f17;
        border: 2px solid rgba(0,229,255,0.90);
        box-shadow: 0 0 0 4px rgba(0,229,255,0.28);
        cursor: pointer;
      }
      .bpmSliderRow input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #0b0f17;
        border: 2px solid rgba(0,229,255,0.90);
        box-shadow: 0 0 0 4px rgba(0,229,255,0.28);
        cursor: pointer;
      }
      .bpmSliderRow input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 999px;

    <script>
      (() => {
        "use strict";

        // ===== Utilities =====
        const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

        function showToast(msg, ms = 1400) {
          const el = document.getElementById("toast");
          el.textContent = msg;
          el.classList.add("show");
          window.clearTimeout(showToast._t);
          showToast._t = window.setTimeout(() => el.classList.remove("show"), ms);
        }

        function formatDivision(div) {
          if (div === 1) return "1/4";
          if (div === 2) return "1/8";
          if (div === 4) return "1/16";
          if (div === 3) return "Triplet";
          return String(div);
        }

        const GROOVE_PRESETS = {
          standard: {
            label: "Standard",
            division: 1,
            // accent per beat (0-based): 2 = 強, 1 = 中, 0 = 弱
            pattern4: [2, 1, 1, 1],
          },
          boombap: {
            label: "Boom Bap",
            division: 2, // 1/8 音符
            pattern4: [1, 2, 1, 2], // 強調第 2 & 4 拍（永遠鎖定）
          },
          trap: {
            label: "Trap",
            division: 3, // Triplet（三連音）
            pattern4: [2, 1, 2, 1], // 稍微強調每小節開頭與第三拍
          },
          reggae: {
            label: "Reggae",
            division: 2, // 1/8 音符
            pattern4: [1, 2, 1, 2], // 第 2、4 拍強音（重音），模擬雷鬼/爵士的後半拍強調感
          },
        };

        // ===== Cell Modes =====
        const CELL_MODES = {
          quarter: { label: "1/4", div: 1, step: 48 },      // 每拍 1 個點
          eighth: { label: "1/8", div: 2, step: 24 },       // 每拍 2 個點
          sixteenth: { label: "1/16", div: 4, step: 12 },  // 每拍 4 個點
          triplet: { label: "Triplet", div: 3, step: 16 },   // 每拍 3 個點（三連音）
        };
        const CELL_MODE_ORDER = ["quarter", "eighth", "sixteenth", "triplet"];

        // ===== Web Audio Metronome (Lookahead Scheduler) =====
        class MetronomeEngine {
          constructor() {
            this.audio = null;
            this.master = null;
            this.isPlaying = false;

            this.bpm = 92;
            this.beatsPerBar = 4;
            this.division = 1; // subdivisions per beat (1,2,3,4) - legacy, kept for compatibility
            this.pendingDivision = null;

            // Cell Editor: 每一拍的細分模式 (0-3 for 4 beats)
            this.cellModes = ["quarter", "quarter", "quarter", "quarter"]; // 預設全部 1/4

            this.nextTickTime = 0;
            this.microIndex = 0; // 1/48 網格索引
            this.lastTickTime = 0;

            this.microDiv = 48; // 最小細分單位（1/48）
            // iOS 背景會節流/凍結 timer，若 scheduleAheadTime 太短會直接斷音
            this._defaultScheduleAheadTime = 0.16;
            this._defaultSchedulerIntervalMs = 25;
            this._backgroundScheduleAheadTime = 3.0;
            this._backgroundSchedulerIntervalMs = 400;
            this._isBackgroundMode = false;

            this.scheduleAheadTime = this._defaultScheduleAheadTime;
            this.schedulerIntervalMs = this._defaultSchedulerIntervalMs;
            this._timer = null;

            this.gainDown = 0.85;
            this.gainBeat = 0.65;
            this.gainSub = 0.40;
            
            // Trap Snare 音色緩存（TR-808 Clap/Snare 混合音）
            this._trapSnareBuffer = null;
            
            // Reggae 反拍音色緩存
            this._reggaeOffbeatBuffer = null;

            // UI sync hint
            this._lastScheduledInfo = { bar: 1, beat: 1, sub: 1, isDownbeat: true, isBeatBoundary: true };

            this.grooveName = "standard";
            
            // Boom Bap 音色緩存
            this._boombapBuffers = {};

            // Ghost Mode: 隨機空拍訓練
            this.ghostMode = false;
            this.ghostProbability = 0.15; // 15% 機率空拍
            this._ghostState = {
              isGhosting: false,
              ghostUntilMicro: -1, // 空拍到哪個 microIndex
            };

            // Swing: 偶數拍延遲（0-100%，50% = 無 swing，66% = 經典 swing）
            this.swing = 0; // 0-100

            // Progressive Training Mode: 漸進式練習模式
            this.progressiveMode = false;
            this.initialBpm = 92; // 記錄開始時的 BPM
            this.progressiveBarsPerStep = 4; // 每 4 小節提速一次
            this.progressiveBpmIncrement = 2; // 每次增加 2 BPM
            this.progressiveMaxBpm = 200; // 最大 BPM 限制
            this._lastProgressiveBar = 0;
            this._shouldFlashBpm = false; // 觸發視覺閃爍
            
            // 训练数据记录：当前会话
            this._currentSession = null;
            this._sessionStartTime = null;
          }

          async ensureAudioUnlocked() {
            if (!this.audio) {
              const AC = window.AudioContext || window.webkitAudioContext;
              this.audio = new AC({ latencyHint: "interactive" });
              this.master = this.audio.createGain();
              this.master.gain.value = 0.9;
              this.master.connect(this.audio.destination);
            }
            if (this.audio.state !== "running") {
              await this.audio.resume();
            }
          }

          setBackgroundMode(enabled) {
            this._isBackgroundMode = !!enabled;
            if (this._isBackgroundMode) {
              this.scheduleAheadTime = this._backgroundScheduleAheadTime;
              this.schedulerIntervalMs = this._backgroundSchedulerIntervalMs;
              // 立刻多排一段，減少背景 timer 變慢造成的「空窗」
              try {
                this._schedulerStep(() => {});
              } catch (e) {
                // ignore
              }
            } else {
              this.scheduleAheadTime = this._defaultScheduleAheadTime;
              this.schedulerIntervalMs = this._defaultSchedulerIntervalMs;
            }
          }

          setBpm(bpm) {
            this.bpm = clamp(Math.round(bpm), 40, 240);
          }

          requestDivision(div) {
            // Apply on next beat boundary for stable feel
            if (div === this.division) return;
            this.pendingDivision = div;
          }

          setGroove(name) {
            if (!GROOVE_PRESETS[name]) return;
            this.grooveName = name;
          }

          setGhostMode(enabled) {
            this.ghostMode = enabled;
            if (!enabled) {
              // 關閉時重置 ghost state
              this._ghostState.isGhosting = false;
              this._ghostState.ghostUntilMicro = -1;
            }
          }

          setSwing(percent) {
            this.swing = clamp(Math.round(percent), 0, 100);
          }

          setProgressiveMode(enabled) {
            this.progressiveMode = enabled;
            if (enabled) {
              // 啟用時記錄當前 BPM 作為起始點
              this.initialBpm = this.bpm;
              this._lastProgressiveBar = 0;
            } else {
              // 關閉時恢復到初始 BPM
              this.bpm = this.initialBpm;
            }
          }


          // 計算 swing 延遲（針對偶數拍）
          _getSwingDelay(microInBar) {
            if (this.swing === 0 || this.swing === 50) return 0; // 無 swing
            
            const beatIdx = Math.floor(microInBar / this.microDiv); // 0-3
            const isEvenBeat = (beatIdx === 1 || beatIdx === 3); // 第 2、4 拍（0-based: 1, 3）
            
            if (!isEvenBeat) return 0; // 奇數拍不延遲
            
            // Swing 計算：從 50% 開始，每增加 1% 延遲約 0.4% 的拍長
            // 66% swing = 經典 triplet swing（延遲約 6.4%）
            const swingOffset = (this.swing - 50) / 50; // -1 到 1
            const secPerBeat = 60 / this.bpm;
            const delay = swingOffset * secPerBeat * 0.16; // 最大延遲約 16% 拍長
            
            return Math.max(0, delay);
          }

          // 計算 Boom Bap 風格的 swing 延遲（針對 1/8 音符的反拍）
          _getBoomBapSwingDelay(posInBeat, cellMode) {
            // 只在 1/8 音符模式下應用 58% swing
            if (cellMode !== "eighth") return 0;
            
            // 1/8 音符：posInBeat = 0 (on-beat), posInBeat = 24 (off-beat '&')
            // 只在 off-beat 時應用延遲
            if (posInBeat !== 24) return 0;
            
            // 58% swing: 計算延遲
            // 58% = (58 - 50) / 50 = 0.16 的 swing offset
            const swingOffset = (58 - 50) / 50; // 0.16
            const secPerBeat = 60 / this.bpm;
            const delay = swingOffset * secPerBeat * 0.16; // 約 3.2% 拍長的延遲
            
            return Math.max(0, delay);
          }

          // 檢查是否是 1/16 音符的 'e' 或 'a' 位置（ghost notes）
          _isSixteenthGhostNote(posInBeat) {
            // 1/16 音符：posInBeat = 0 ('1'), 12 ('e'), 24 ('&'), 36 ('a')
            // 'e' 和 'a' 是 ghost notes
            return posInBeat === 12 || posInBeat === 36;
          }

          // Cell Editor: 設定整小節為同一模式（模板功能）
          setAllCellsToMode(mode) {
            if (!CELL_MODES[mode]) return;
            for (let i = 0; i < this.beatsPerBar; i++) {
              this.cellModes[i] = mode;
            }
          }

          // Cell Editor: 切換單一拍的模式
          cycleCellMode(beatIndex) {
            if (beatIndex < 0 || beatIndex >= this.beatsPerBar) return;
            const current = this.cellModes[beatIndex];
            const idx = CELL_MODE_ORDER.indexOf(current);
            const nextIdx = (idx + 1) % CELL_MODE_ORDER.length;
            this.cellModes[beatIndex] = CELL_MODE_ORDER[nextIdx];
            return this.cellModes[beatIndex];
          }

          // 取得某一拍的模式
          getCellMode(beatIndex) {
            return this.cellModes[beatIndex] || "quarter";
          }

          // 檢查在 1/48 網格中，某個位置是否應該打點
          _shouldTickAtMicro(microInBar) {
            const beatIdx = Math.floor(microInBar / this.microDiv); // 0-3
            const posInBeat = microInBar % this.microDiv; // 0-47
            const mode = this.getCellMode(beatIdx);
            const cellDef = CELL_MODES[mode];
            if (!cellDef) return false;
            return posInBeat % cellDef.step === 0;
          }

          _microIntervalSec() {
            const secPerBeat = 60 / this.bpm;
            return secPerBeat / this.microDiv;
          }

          _tickIntervalSec(currentDivision = this.division) {
            const secPerBeat = 60 / this.bpm;
            return secPerBeat / currentDivision;
          }

          _ticksPerBar(currentDivision = this.division) {
            return this.beatsPerBar * currentDivision;
          }

          // 檢查是否是 Reggae 的反拍位置（支持所有細分）
          _isReggaeOffbeat(cellMode, posInBeat) {
            if (cellMode === "quarter") {
              return false; // 1/4 沒有細分，沒有反拍
            } else if (cellMode === "eighth") {
              // 1/8: 第二個八分音符（posInBeat === 24）
              return posInBeat === 24;
            } else if (cellMode === "sixteenth") {
              // 1/16: 第二、四個十六分音符（posInBeat === 12, 36）
              return posInBeat === 12 || posInBeat === 36;
            } else if (cellMode === "triplet") {
              // Triplet: 第二個三連音（posInBeat === 16）
              return posInBeat === 16;
            }
            return false;
          }

          // 生成 Reggae 風格的反拍音色（用於 Reggae 風格的反拍）
          _createReggaeOffbeatSound() {
            if (this._reggaeOffbeatBuffer) return this._reggaeOffbeatBuffer;
            
            const sampleRate = this.audio.sampleRate;
            const duration = 0.10; // 稍長，更有彈性
            const length = Math.floor(sampleRate * duration);
            const buffer = this.audio.createBuffer(1, length, sampleRate);
            const data = buffer.getChannelData(0);
            
            // Reggae 反拍特徵：
            // 1. 中頻正弦波（模擬吉他或鍵盤的彈撥聲）
            // 2. 輕微的白噪音（模擬打擊感）
            // 3. 較慢的衰減（更有彈性）
            
            for (let i = 0; i < length; i++) {
              const t = i / sampleRate;
              
              // 中頻正弦波（約 400-500Hz，模擬吉他彈撥）
              let tone = 0;
              const fundamental = 450;
              const harmonics = [1, 1.5, 2]; // 諧波
              harmonics.forEach((harmonic, idx) => {
                const amp = idx === 0 ? 0.4 : 0.2 / idx;
                tone += Math.sin(2 * Math.PI * fundamental * harmonic * t) * amp;
              });
              
              // 輕微白噪音（打擊感）
              const noise = (Math.random() * 2 - 1) * 0.3;
              
              // 包絡：快速攻擊，較慢衰減（更有彈性）
              let envelope = 1.0;
              if (t < 0.002) {
                envelope = t / 0.002;
              } else {
                envelope = Math.exp(-t / 0.04); // 較慢的衰減
              }
              
              // 混合音色，應用包絡
              data[i] = (tone * 0.7 + noise * 0.3) * envelope;
            }
            
            this._reggaeOffbeatBuffer = buffer;
            return buffer;
          }

          // 生成 Boom Bap 風格的鼓聲音色（用於 Boom Bap 風格）
          _createBoomBapSound(type) {
            const cacheKey = `boombap_${type}`;
            if (this._boombapBuffers[cacheKey]) {
              return this._boombapBuffers[cacheKey];
            }
            
            const sampleRate = this.audio.sampleRate;
            let duration = 0.15;
            let buffer;
            let data;
            
            if (type === "kick") {
              // Kick: Deep, punchy kick using Sine wave with rapid pitch envelope decay
              // Add slight distortion/low-pass filter for "dusty" 90s vinyl sound
              duration = 0.25;
              const length = Math.floor(sampleRate * duration);
              buffer = this.audio.createBuffer(1, length, sampleRate);
              data = buffer.getChannelData(0);
              
              const startFreq = 60; // 起始頻率
              const endFreq = 30;  // 結束頻率（快速音高衰減）
              
              for (let i = 0; i < length; i++) {
                const t = i / sampleRate;
                
                // 音高包絡：快速衰減（模擬 "thud" 聲）
                const pitchEnv = startFreq + (endFreq - startFreq) * Math.exp(-t * 20);
                
                // 正弦波
                let sample = Math.sin(2 * Math.PI * pitchEnv * t);
                
                // 輕微失真（模擬黑膠唱片的 "dusty" 感）
                sample = Math.tanh(sample * 1.2) * 0.85;
                
                // 低通濾波效果（模擬黑膠的溫暖感）
                // 簡單實現：衰減高頻成分
                const lowpassEnv = Math.exp(-t * 8);
                sample *= lowpassEnv;
                
                // 包絡：快速攻擊，中等衰減
                let envelope = 1.0;
                if (t < 0.003) {
                  envelope = t / 0.003;
                } else {
                  envelope = Math.exp(-t * 6);
                }
                
                data[i] = sample * envelope * 0.9;
              }
            } else if (type === "snare") {
              // Snare: Dry, crisp snare using White Noise + short triangle wave body
              // Should sound tight, not reverb-heavy
              duration = 0.12;
              const length = Math.floor(sampleRate * duration);
              buffer = this.audio.createBuffer(1, length, sampleRate);
              data = buffer.getChannelData(0);
              
              for (let i = 0; i < length; i++) {
                const t = i / sampleRate;
                
                // 白噪音（主要成分）
                const noise = (Math.random() * 2 - 1) * 0.7;
                
                // 短三角波體（增加緊實感）
                const triangleFreq = 200;
                const trianglePhase = (t * triangleFreq) % 1;
                let triangle = trianglePhase < 0.5 
                  ? 4 * trianglePhase - 1 
                  : 3 - 4 * trianglePhase;
                triangle *= 0.3;
                
                // 混合噪音和三角波
                let sample = noise + triangle;
                
                // 包絡：極快攻擊，快速衰減（保持乾燥、緊實）
                let envelope = 1.0;
                if (t < 0.001) {
                  envelope = t / 0.001;
                } else {
                  envelope = Math.exp(-t * 15); // 快速衰減，無混響
                }
                
                data[i] = sample * envelope * 0.85;
              }
            } else if (type === "hihat") {
              // Hi-Hat: Short, high-frequency metal sound using high-pass filtered noise
              duration = 0.06;
              const length = Math.floor(sampleRate * duration);
              buffer = this.audio.createBuffer(1, length, sampleRate);
              data = buffer.getChannelData(0);
              
              for (let i = 0; i < length; i++) {
                const t = i / sampleRate;
                
                // 白噪音
                const noise = (Math.random() * 2 - 1) * 0.6;
                
                // 高通濾波效果（模擬金屬聲）
                // 簡單實現：增加高頻成分，減少低頻
                const highpassEnv = 1 - Math.exp(-t * 30); // 快速去除低頻
                let sample = noise * highpassEnv;
                
                // 高頻正弦波疊加（增加金屬感）
                const metalFreq = 8000;
                const metalTone = Math.sin(2 * Math.PI * metalFreq * t) * 0.2;
                sample += metalTone;
                
                // 包絡：極快攻擊，快速衰減
                let envelope = 1.0;
                if (t < 0.0005) {
                  envelope = t / 0.0005;
                } else {

                }
                
                data[i] = sample * envelope * 0.75;
              }
            }
            
            if (buffer) {
              this._boombapBuffers[cacheKey] = buffer;
              return buffer;
            }
            
            // Fallback
            const fallbackLength = Math.floor(sampleRate * 0.1);
            const fallbackBuffer = this.audio.createBuffer(1, fallbackLength, sampleRate);
            return fallbackBuffer;
          }
          
          // 生成 TR-808 風格的 Clap/Snare 混合音（用於 Trap 風格）
          _createTrapSnareSound() {
            if (this._trapSnareBuffer) return this._trapSnareBuffer;
            
            const sampleRate = this.audio.sampleRate;
            const duration = 0.08; // 更短、更脆
            const length = Math.floor(sampleRate * duration);
            const buffer = this.audio.createBuffer(1, length, sampleRate);
            const data = buffer.getChannelData(0);
            
            // TR-808 Clap/Snare 特徵：
            // 1. 高頻正弦波（模擬 Snare 的響弦）
            // 2. 白噪音（模擬 Clap 的拍擊聲）
            // 3. 快速衰減
            
            for (let i = 0; i < length; i++) {
              const t = i / sampleRate;
              
              // 高頻正弦波（Snare 響弦，約 200-300Hz 的諧波）
              let snare = 0;
              const snareFreq = 250;
              const snareHarmonics = [1, 2, 3, 4]; // 多個諧波
              snareHarmonics.forEach((harmonic, idx) => {
                const amp = 0.3 / (idx + 1); // 諧波衰減
                snare += Math.sin(2 * Math.PI * snareFreq * harmonic * t) * amp;
              });
              
              // 白噪音（Clap 拍擊聲）
              const noise = (Math.random() * 2 - 1) * 0.6;
              
              // 包絡：快速攻擊，快速衰減
              let envelope = 1.0;
              if (t < 0.001) {
                // 極快攻擊
                envelope = t / 0.001;
              } else {
                // 快速指數衰減
                envelope = Math.exp(-t / 0.015);
              }
              
              // 混合 Snare 和 Clap，應用包絡
              data[i] = (snare * 0.4 + noise * 0.6) * envelope;
            }
            
            this._trapSnareBuffer = buffer;
            return buffer;
          }

          _scheduleClick(time, { isDownbeat, isBeatBoundary, accentLevel, cellMode, posInBeat, beatIdx = 0 }) {
            const level = accentLevel ?? (isDownbeat ? 2 : isBeatBoundary ? 1 : 0);
            
            // Trap 風格：使用 TR-808 Clap/Snare 混合音（僅用於 Snare，即 level >= 1）
            if (this.grooveName === "trap" && level >= 1) {

              const source = this.audio.createBufferSource();
              const gain = this.audio.createGain();
              
              source.buffer = buffer;
              const amp = level >= 2 ? this.gainDown : this.gainBeat;
              gain.gain.setValueAtTime(amp, time);
              
              source.connect(gain);
              gain.connect(this.master);
              
              source.start(time);
              source.stop(time + buffer.duration);
              return;

              const source = this.audio.createBufferSource();
              const gain = this.audio.createGain();
              
              source.buffer = buffer;
              gain.gain.setValueAtTime(this.gainDown, time);
              
              source.connect(gain);
              gain.connect(this.master);
              
              source.start(time);
              source.stop(time + buffer.duration);
              return;
            }
            
            // Boom Bap 風格：使用特殊音色合成
            if (this.grooveName === "boombap") {
              let drumType;
              let amp;
              
              // Boom Bap 特殊音量處理：
              // level 2: Heavy accent (Beat 2 & 4, hard snare) - 使用 snare
              // level 1.8: Beat 1 (strong but slightly less) - 使用 kick，音量稍低
              // level 1.6: 1/8 off-beat (80% velocity, loud hi-hats) - 使用 hihat，音量較高
              // level 1: Medium accent (Beat 3) - 使用 kick
              // level 0.35: Ghost notes ('e' and 'a' in 1/16) - 使用 hihat，音量很低
              // level 0: 其他
              
              // 1/16 音符特殊處理：on-beat 使用 kick/snare，off-beat 使用 hi-hat
              if (cellMode === "sixteenth" && !isBeatBoundary) {
                // 所有 1/16 的 off-beat 都使用 hi-hat
                drumType = "hihat";
                if (level >= 0.3 && this._isSixteenthGhostNote && this._isSixteenthGhostNote(posInBeat)) {
                  // 'e' and 'a': Ghost notes (30-40% velocity)
                  amp = this.gainSub * 0.35; // 35% of gainSub
                } else if (posInBeat === 24) {

                  amp = this.gainSub * 0.6; // 60% of gainSub
                } else {

                drumType = "snare";
                amp = this.gainBeat;
              } else if (level >= 1.8) {

                drumType = "kick";
                amp = this.gainDown * 0.9; // 90% of gainDown

                drumType = "hihat";
                amp = this.gainBeat * 0.8; // 80% of gainBeat (響亮的 hi-hats)
              } else if (level >= 1) {
                // Beat 3: Medium accent (kick)
                drumType = "kick";
                amp = this.gainDown * 0.7; // 70% of gainDown
              } else if (level >= 0.3) {
                // Ghost notes ('e' and 'a' in 1/16): Very quiet (30-40% velocity)
                drumType = "hihat";
                amp = this.gainSub * 0.35; // 35% of gainSub (ghost note)
              } else {
                // 其他：靜音或極小音量
                drumType = "hihat";
                amp = this.gainSub * 0.1;
              }
              
              const buffer = this._createBoomBapSound(drumType);
              const source = this.audio.createBufferSource();
              const gain = this.audio.createGain();
              
              source.buffer = buffer;
              gain.gain.setValueAtTime(amp, time);
              
              source.connect(gain);
              gain.connect(this.master);
              
              source.start(time);
              source.stop(time + buffer.duration);
              return;
            }
            
            // 使用鼓組音色
            let drumType;
            let amp;
            
            if (level >= 2) {
              drumType = "kick";
              amp = this.gainDown;
            } else if (level === 1) {
              drumType = "snare";
              amp = this.gainBeat;
            } else {
              drumType = "hihat";
              amp = this.gainSub;
            }
            
            // 使用標準 oscillator click（電子高頻點擊）
            const osc = this.audio.createOscillator();
            const gain = this.audio.createGain();

            const dur = 0.030;
            const attack = 0.002;

            let freq = 1050;
            if (level >= 2) {
              freq = 2050;
            } else if (level === 1) {
              freq = 1500;
            }

            osc.type = "square";
            osc.frequency.setValueAtTime(freq, time);

            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, amp), time + attack);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

            osc.connect(gain);
            gain.connect(this.master);

            osc.start(time);
            osc.stop(time + dur + 0.01);

          _schedulerStep(onScheduledTick) {

            const microsPerBar = this.beatsPerBar * this.microDiv; // 4 * 48 = 192

                  if (this._ghostState.isGhosting) {

                    if (isBeatBoundary && Math.random() < this.ghostProbability) {
                      // 空拍持續 1-2 拍（隨機）
                      const ghostBeats = Math.random() < 0.5 ? 1 : 2;
                      const ghostMicros = ghostBeats * this.microDiv;
                      this._ghostState.isGhosting = true;
                      this._ghostState.ghostUntilMicro = this.microIndex + ghostMicros;
                      shouldGhost = true;

                  let accentLevel = 0;
                  const preset = GROOVE_PRESETS[this.grooveName] || GROOVE_PRESETS.standard;
                  const pattern = preset.pattern4 || GROOVE_PRESETS.standard.pattern4;
                  
                  if (isBeatBoundary) {
                    // 拍點（on-beat）：使用 pattern 的重音級別
                    if (this.grooveName === "boombap") {
                      // Boom Bap 特殊處理：Quarter Notes
                      // Beat 2 & 4: Heavy accents (level 2, simulating hard snare)
                      // Beat 1: Strong but slightly less than snare (level 1.8, 使用 2 但音量稍低)
                      // Beat 3: Medium accent (level 1)
                      const beatAccent = pattern[beatIdx % pattern.length] ?? 1;
                      if (beatIdx === 0) {
                        // Beat 1: Strong but slightly less than snare
                        accentLevel = 1.8; // 使用 1.8 表示強但略小於 level 2
                      } else if (beatIdx === 1 || beatIdx === 3) {

                        accentLevel = 1;

                        // Off-beat ('&') should have velocity ~80% (loud hi-hats)
                        if (posInBeat === 24) {

                          accentLevel = 1.6;

                        if (this._isSixteenthGhostNote(posInBeat)) {

                          accentLevel = 0.35;

                      // 支持所有細分：1/8, 1/16, triplet
                      if (this._isReggaeOffbeat(cellMode, posInBeat)) {
                        const beatAccent = pattern[beatIdx % pattern.length] ?? 1;
                        // 如果是第二拍或第四拍（重音拍），off-beat 有強重音
                        if (beatAccent >= 2) {
                          accentLevel = 2; // 第 2、4 拍的 off-beat 是強重音（後半拍強調）
                        } else {
                          accentLevel = 0; // 其他拍的 off-beat 無重音
                        }
                      } else {
                        accentLevel = 0; // 其他細分點無重音
                      }
                    } else {
                      // 其他風格：細分點通常無重音或弱重音
                      accentLevel = 0;
                    }
                  }

                  // Swing: 計算延遲
                  let swingDelay = 0;
                  if (this.grooveName === "boombap") {
                    // Boom Bap: 對 1/8 音符應用特殊的 58% swing
                    const cellMode = this.getCellMode(beatIdx);
                    swingDelay = this._getBoomBapSwingDelay(posInBeat, cellMode);
                    // 如果沒有應用 Boom Bap swing，使用通用 swing
                    if (swingDelay === 0) {
                      swingDelay = this._getSwingDelay(microInBar);
                    }
                  } else {
                    swingDelay = this._getSwingDelay(microInBar);
                  }
                  const scheduledTime = this.nextTickTime + swingDelay;

                  // 獲取當前的 cell mode 用於音色判斷
                  const cellModeForClick = this.getCellMode(beatIdx);
                  
                  this._scheduleClick(scheduledTime, {
                    isDownbeat,
                    isBeatBoundary,
                    accentLevel,
                    cellMode: cellModeForClick,
                    posInBeat,
                    beatIdx,
                  });
                }

                this.lastTickTime = this.nextTickTime;

                // 計算 sub 資訊（用於 UI 顯示）
                const cellMode = this.getCellMode(beatIdx);
                const cellDef = CELL_MODES[cellMode];
                const sub = Math.floor(posInBeat / cellDef.step) + 1;
                const bar = Math.floor(this.microIndex / microsPerBar) + 1;

                // Progressive Training Mode: 檢查是否需要提速
                if (this.progressiveMode && isDownbeat && bar > this._lastProgressiveBar) {
                  const barsSinceLastStep = bar - this._lastProgressiveBar;
                  if (barsSinceLastStep >= this.progressiveBarsPerStep) {
                    const newBpm = Math.min(
                      this.bpm + this.progressiveBpmIncrement,
                      this.progressiveMaxBpm
                    );
                    if (newBpm > this.bpm) {
                      this.bpm = newBpm;
                      this._shouldFlashBpm = true; // 觸發視覺閃爍
                      this._lastProgressiveBar = bar;
                    }
                  }
                }

                // 計算當前重音級別（用於 UI 顏色回饋）
                let currentAccentLevel = 0;
                if (!shouldGhost) {
                  const preset = GROOVE_PRESETS[this.grooveName] || GROOVE_PRESETS.standard;
                  const pattern = preset.pattern4 || GROOVE_PRESETS.standard.pattern4;
                  
                  if (isBeatBoundary) {
                    // 拍點（on-beat）：使用 pattern 的重音級別
                    if (this.grooveName === "boombap") {
                      // Boom Bap 特殊處理：Quarter Notes
                      // Beat 2 & 4: Heavy accents (level 2, simulating hard snare)
                      // Beat 1: Strong but slightly less than snare (level 1.8)
                      // Beat 3: Medium accent (level 1)
                      if (beatIdx === 0) {
                        currentAccentLevel = 1.8; // Beat 1: Strong but slightly less
                      } else if (beatIdx === 1 || beatIdx === 3) {
                        currentAccentLevel = 2; // Beat 2 & 4: Heavy accents
                      } else {
                        currentAccentLevel = 1; // Beat 3: Medium accent
                      }
                    } else if (this.grooveName === "reggae") {
                      // Reggae 特殊處理：重音在 off-beat，所以 on-beat 降低重音
                      const beatAccent = pattern[beatIdx % pattern.length] ?? 1;
                      if (beatAccent >= 2) {
                        currentAccentLevel = 1; // 第 2、4 拍的 on-beat 降為中等重音（重音在 off-beat）
                      } else {
                        currentAccentLevel = beatAccent; // 其他拍保持原樣
                      }
                    } else {
                      currentAccentLevel = pattern[beatIdx % pattern.length] ?? 1;
                    }
                  } else {
                    // 細分點（off-beat 或其他細分）
                    const cellMode = this.getCellMode(beatIdx);
                    
                    if (this.grooveName === "boombap") {
                      // Boom Bap 特殊處理
                      if (cellMode === "eighth") {
                        // Eighth Notes: Off-beat ('&') should have velocity ~80% (loud hi-hats)
                        if (posInBeat === 24) {
                          currentAccentLevel = 1.6; // Off-beat: 80% velocity
                        } else {
                          currentAccentLevel = 0; // On-beat: 已在 isBeatBoundary 處理
                        }
                      } else if (cellMode === "sixteenth") {
                        // Sixteenth Notes: 'Funky Drummer' feel
                        // 'e' and 'a' subdivisions very quiet (Velocity 30-40) as ghost notes
                        if (this._isSixteenthGhostNote(posInBeat)) {
                          currentAccentLevel = 0.35; // Ghost notes
                        } else if (posInBeat === 24) {
                          currentAccentLevel = 1; // Off-beat: Medium volume
                        } else {
                          currentAccentLevel = 0; // On-beat: 已在 isBeatBoundary 處理
                        }
                      } else {
                        // Quarter Notes: 已在 isBeatBoundary 處理
                        currentAccentLevel = 0;
                      }
                    } else if (this.grooveName === "reggae") {
                      // Reggae 特殊處理：第 2、4 拍的反拍（off-beat）有強重音
                      // 模擬雷鬼/爵士的後半拍強調感
                      // 支持所有細分：1/8, 1/16, triplet
                      if (this._isReggaeOffbeat(cellMode, posInBeat)) {
                        const beatAccent = pattern[beatIdx % pattern.length] ?? 1;
                        if (beatAccent >= 2) {
                          currentAccentLevel = 2; // 第 2、4 拍的 off-beat 是強重音
                        } else {
                          currentAccentLevel = 0; // 其他拍的 off-beat 無重音
                        }
                      } else {
                        currentAccentLevel = 0; // 其他細分點無重音
                      }
                    } else {
                      // 其他風格：細分點通常無重音
                      currentAccentLevel = 0;
                    }
                  }
                }

                this._lastScheduledInfo = {
                  bar,
                  beat: beatIdx + 1,
                  sub,
                  isDownbeat,
                  isBeatBoundary,
                  cellMode,
                  isGhost: shouldGhost,
                  accentLevel: currentAccentLevel,
                };

                if (onScheduledTick) {
                  onScheduledTick({
                    time: this.nextTickTime,
                    microIndex: this.microIndex,
                    microInBar,
                    beatIdx,
                    posInBeat,
                    bar,
                    beat: beatIdx + 1,
                    sub,
                    isDownbeat,
                    isBeatBoundary,
                    cellMode,
                  });
                }
              }

              // 無論是否有打點，時間軸都要繼續前進
              this.nextTickTime += microInterval;
              this.microIndex += 1;
            }
          }

          start(onScheduledTick) {
            if (!this.audio) throw new Error("Audio not ready");
            if (this.isPlaying) return;

            // Re-sync to current audio time to avoid drift after pause/background
            const audioNow = this.audio.currentTime;
            const warmup = 0.06;
            this.nextTickTime = audioNow + warmup;
            this.lastTickTime = audioNow;

            // Align microIndex to start at bar boundary for clearer training
            this.microIndex = 0;

            // Progressive Mode: 重置狀態
            if (this.progressiveMode) {
              this.initialBpm = this.bpm;
              this._lastProgressiveBar = 0;
            }

            // 开始记录训练会话
            this._startTrainingSession();

            this.isPlaying = true;
            const loop = () => {
              this._schedulerStep(onScheduledTick);
              if (!this.isPlaying) return;
              this._timer = window.setTimeout(loop, this.schedulerIntervalMs);
            };
            loop();
          }

          stop() {
            if (!this.isPlaying) return;
            this.isPlaying = false;
            if (this._timer) {
              window.clearTimeout(this._timer);
              this._timer = null;
            }
            
            // 结束并保存训练会话
            this._endTrainingSession();
          }
          
          _startTrainingSession() {
            this._sessionStartTime = Date.now();
            this._currentSession = {
              startTime: new Date().toISOString(),
              bpm: this.bpm,
              initialBpm: this.bpm,
              groove: this.grooveName,
              division: this.division,
              cellModes: [...this.cellModes],
              ghostMode: this.ghostMode,
              progressiveMode: this.progressiveMode,
              swing: this.swing,
            };
          }
          
          _endTrainingSession() {
            if (!this._currentSession || !this._sessionStartTime) return;
            
            const duration = Math.floor((Date.now() - this._sessionStartTime) / 1000);
            if (duration < 1) {
              // 少于1秒不保存
              this._currentSession = null;
              this._sessionStartTime = null;
              return;
            }
            
            const record = {
              ...this._currentSession,
              endTime: new Date().toISOString(),
              duration: duration,
              finalBpm: this.bpm,
            };
            
            // 保存到日历系统
            TrainingCalendar.saveSession(record);
            
            // 清理会话状态
            this._currentSession = null;
            this._sessionStartTime = null;
          }
        }

        // ===== Settings Persistence =====
        const SETTINGS_KEY = "rapMetronomeSettings";
        const TRAINING_CALENDAR_KEY = "rapMetronomeTrainingCalendar";

        // ===== Daily Goal System =====
        class DailyGoal {
          static GOAL_MINUTES = 20; // 固定20分钟
          
          static getGoal() {
            return this.GOAL_MINUTES;
          }
          
          static getTodayProgress() {
            const todayData = TrainingCalendar.getDateData(new Date());
            if (!todayData || !todayData.totalDuration) {
              return { duration: 0, goal: this.GOAL_MINUTES * 60 };
            }
            return {
              duration: todayData.totalDuration, // 秒
              goal: this.GOAL_MINUTES * 60, // 转换为秒
            };
          }
          
          static getProgressPercent() {
            const { duration, goal } = this.getTodayProgress();
            if (goal === 0) return 0;
            return Math.min(100, Math.round((duration / goal) * 100));
          }
          
          // 检查指定日期是否达成目标（20分钟 = 1200秒）
          static isGoalAchieved(date) {
            const dayData = TrainingCalendar.getDateData(date);
            if (!dayData || !dayData.totalDuration) return false;
            return dayData.totalDuration >= 1200; // 20分钟 = 1200秒
          }
        }
        
        // ===== Training Calendar System =====
        class TrainingCalendar {
          // 获取日期键（YYYY-MM-DD格式）
          static getDateKey(date = new Date()) {
            const d = date instanceof Date ? date : new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
          }
          
          // 保存训练会话
          static saveSession(session) {
            try {
              const dateKey = this.getDateKey();
              const calendar = this.loadCalendar();
              
              if (!calendar[dateKey]) {
                calendar[dateKey] = {
                  date: dateKey,
                  sessions: [],
                  totalDuration: 0,
                  totalSessions: 0,
                };
              }
              
              calendar[dateKey].sessions.push(session);
              calendar[dateKey].totalDuration += session.duration || 0;
              calendar[dateKey].totalSessions = calendar[dateKey].sessions.length;
              
              // 只保留最近365天的数据
              const cutoffDate = new Date();
              cutoffDate.setDate(cutoffDate.getDate() - 365);
              const cutoffKey = this.getDateKey(cutoffDate);
              
              Object.keys(calendar).forEach(key => {
                if (key < cutoffKey) {
                  delete calendar[key];
                }
              });
              
              localStorage.setItem(TRAINING_CALENDAR_KEY, JSON.stringify(calendar));
              
              // 触发更新事件
              window.dispatchEvent(new CustomEvent('trainingCalendarUpdated', { detail: { dateKey } }));
              
              return true;
            } catch (e) {
              console.warn("Failed to save training session:", e);
              return false;
            }
          }
          
          // 加载日历数据
          static loadCalendar() {
            try {
              const saved = localStorage.getItem(TRAINING_CALENDAR_KEY);
              return saved ? JSON.parse(saved) : {};
            } catch (e) {
              console.warn("Failed to load training calendar:", e);
              return {};
            }
          }
          
          // 获取特定日期的数据
          static getDateData(date) {
            const calendar = this.loadCalendar();
            const dateKey = date instanceof Date ? this.getDateKey(date) : date;
            return calendar[dateKey] || null;
          }
          
          // 获取月份的所有数据
          static getMonthData(year, month) {
            const calendar = this.loadCalendar();
            const monthKey = `${year}-${String(month).padStart(2, '0')}`;
            const result = {};
            
            Object.keys(calendar).forEach(dateKey => {
              if (dateKey.startsWith(monthKey)) {
                result[dateKey] = calendar[dateKey];
              }
            });
            
            return result;
          }
          
          // 获取统计数据
          static getStats() {
            const calendar = this.loadCalendar();
            let totalDuration = 0;
            let daysWithTraining = 0;
            
            Object.values(calendar).forEach(dayData => {
              totalDuration += dayData.totalDuration || 0;
              if (dayData.totalSessions > 0) {
                daysWithTraining++;
              }
            });
            
            return {
              totalDuration,
              daysWithTraining,
            };
          }
          
          // 获取BPM范围（每5 BPM为区间）
          static getBpmRange(bpm) {
            // 向下取整到5的倍数
            const rounded = Math.floor(bpm / 5) * 5;
            const start = Math.max(40, rounded);
            const end = Math.min(240, start + 5);
            return { start, end };
          }
          
          // 获取按每5 BPM区间的练习时长统计
          static getBpmRangeStats() {
            const calendar = this.loadCalendar();
            const bpmRanges = {};
            
            // 初始化所有可能的BPM区间（40-240，每5为一个区间）
            for (let bpm = 40; bpm < 240; bpm += 5) {
              const range = this.getBpmRange(bpm);
              const rangeKey = `${range.start}-${range.end}`;
              if (!bpmRanges[rangeKey]) {
                bpmRanges[rangeKey] = {
                  rangeKey: rangeKey,
                  start: range.start,
                  end: range.end,
                  duration: 0,
                };
              }
            }
            
            // 统计每个BPM区间的练习时长
            Object.values(calendar).forEach(dayData => {
              if (dayData.sessions && dayData.sessions.length > 0) {
                dayData.sessions.forEach(session => {
                  // 计算平均BPM（如果是Progressive Mode）
                  const avgBpm = session.progressiveMode && session.finalBpm 
                    ? Math.round((session.bpm + session.finalBpm) / 2)
                    : session.bpm;
                  
                  const range = this.getBpmRange(avgBpm);
                  const rangeKey = `${range.start}-${range.end}`;
                  
                  if (bpmRanges[rangeKey]) {
                    bpmRanges[rangeKey].duration += session.duration || 0;
                  }
                });
              }
            });
            
            // 只返回有数据的区间，按BPM排序
            return Object.values(bpmRanges)
              .filter(range => range.duration > 0)
              .sort((a, b) => a.start - b.start);
          }
          
          // 获取日期按BPM范围分组的数据
          static getDateDataByBpmRange(date) {
            const dayData = this.getDateData(date);
            if (!dayData || !dayData.sessions || dayData.sessions.length === 0) {
              return {};
            }
            
            const ranges = {};
            dayData.sessions.forEach(session => {
              // 计算平均BPM（如果是Progressive Mode）
              const avgBpm = session.progressiveMode && session.finalBpm 
                ? Math.round((session.bpm + session.finalBpm) / 2)
                : session.bpm;
              
              const range = this.getBpmRange(avgBpm);
              const rangeKey = `${range.start}-${range.end}`;
              
              if (!ranges[rangeKey]) {
                ranges[rangeKey] = {
                  rangeKey: rangeKey,
                  start: range.start,
                  end: range.end,
                  duration: 0,
                  sessions: 0,
                };
              }
              
              ranges[rangeKey].duration += session.duration || 0;
              ranges[rangeKey].sessions += 1;
            });
            
            return ranges;
          }
          
          // 获取按风格分组的BPM范围统计（每5 BPM为区间）
          static getBpmRangeStatsByGroove() {
            const calendar = this.loadCalendar();
            const statsByGroove = {};
            
            // 遍历所有训练会话
            Object.values(calendar).forEach(dayData => {
              if (dayData.sessions && dayData.sessions.length > 0) {
                dayData.sessions.forEach(session => {
                  const groove = session.groove || 'standard';
                  
                  // 初始化风格对象
                  if (!statsByGroove[groove]) {
                    statsByGroove[groove] = {};
                  }
                  
                  // 计算平均BPM（如果是Progressive Mode）
                  const avgBpm = session.progressiveMode && session.finalBpm 
                    ? Math.round((session.bpm + session.finalBpm) / 2)
                    : session.bpm;
                  
                  const range = this.getBpmRange(avgBpm);
                  const rangeKey = `${range.start}-${range.end}`;
                  
                  // 初始化BPM区间
                  if (!statsByGroove[groove][rangeKey]) {
                    statsByGroove[groove][rangeKey] = {
                      rangeKey: rangeKey,
                      start: range.start,
                      end: range.end,
                      duration: 0,
                    };
                  }
                  
                  statsByGroove[groove][rangeKey].duration += session.duration || 0;
                });
              }
            });
            
            // 转换格式：按风格分组，每个风格包含BPM区间数组
            const result = {};
            Object.keys(statsByGroove).forEach(groove => {
              result[groove] = Object.values(statsByGroove[groove])
                .filter(range => range.duration > 0)
                .sort((a, b) => a.start - b.start);
            });
            
            return result;
          }
        }

        function loadSettings() {
          try {
            const saved = localStorage.getItem(SETTINGS_KEY);
            if (!saved) return null;
            
            const settings = JSON.parse(saved);
            // 驗證設定有效性
            if (settings.bpm && settings.bpm >= 40 && settings.bpm <= 240) {
              engine.bpm = settings.bpm;
            }
            if (settings.grooveName && GROOVE_PRESETS[settings.grooveName]) {
              engine.grooveName = settings.grooveName;

            if (settings.swing !== undefined && settings.swing >= 0 && settings.swing <= 100) {

            if (settings.ghostMode !== undefined) {
              engine.ghostMode = settings.ghostMode;

            if (settings.progressiveMode !== undefined) {
              engine.progressiveMode = settings.progressiveMode;
              if (settings.progressiveMode) {
                engine.initialBpm = settings.bpm || engine.bpm;
              }
            }
            if (settings.cellModes && Array.isArray(settings.cellModes) && settings.cellModes.length === 4) {
              // 驗證每個cell mode是否有效
              const validModes = settings.cellModes.filter(m => CELL_MODE_ORDER.includes(m));
              if (validModes.length === 4) {
                engine.cellModes = validModes;
              }
            }
            if (settings.division && [1, 2, 3, 4].includes(settings.division)) {

        const canvas = document.getElementById("timeline");
